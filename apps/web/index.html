<!doctype html>
<!--
  La app trae su propio corrector ortográfico (src/shared/spellcheck), que
  funciona igual en cualquier navegador y configuración. El del navegador se
  apaga aquí (`spellcheck` se hereda) para que no haya doble subrayado. Los
  campos donde el corrector es ruido (buscadores, RUT, URLs) siguen
  excluyéndose con `spellCheck={false}`, que el propio respeta.
-->
<html lang="es" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Kora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
